<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Makeover Studio - Digital Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <div class="header-logo">
            <img src="main_logo.png" width="100%" alt="PM Makeover Studio Logo">
        </div>

        <div class="tagline">PM Makeover Studio</div>

        <div class="section">
            <div class="info-row">
                <div class="icon">
                    <img src="pin.png" width="30px" alt="">
                </div>
                <div>
                    <span class="label">Address</span>
                    <span class="value">Shop 36, Near Neki Ram College, Rohtak, Haryana 124001</span>
                    <br>
                    <a href="https://www.google.com/maps/search/?api=1&query=Shop+36+Neki+Ram+College+Rohtak"
                        class="map-link" target="_blank">Show on Map</a>
                </div>
            </div>

            <a href="https://www.instagram.com/_pm_makeover_studio?igsh=b3djNnl4aHA4cGVm" target="_blank" class="info-row insta-btn">
                <div class="icon">
                    <img src="instagram.png" width="35px" alt="">
                </div>
                <div>
                    <span class="value">Instagram</span>
                </div>
                <div class="arrow">➜</div>
            </a>

            <div style="margin-top: 20px;">
                <span class="label">Contact</span>

                <div class="info-row">
                    <div class="icon">
                        <img src="user.png" width="30px" alt="">
                    </div>
                    <div>
                        <span class="label">Name</span>
                        <span class="value">Preeti Malhotra</span>
                    </div>
                </div>

                <a href="tel:+919138150638" class="info-row phone-link">
                    <div class="icon">
                        <img src="call.png" width="30px" alt="">
                    </div>
                    <div>
                        <span class="label">Phone</span>
                        <span class="value">+91-9138150638</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>

</html>
